<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wheel Spin — Roue de la Fortune</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎡</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Outfit:wght@700;800;900&amp;display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0e12;
    --bg2: #16161d;
    --card: #1c1c26;
    --border: #2a2a38;
    --fg: #eaeaf0;
    --muted: #6e6e82;
    --accent: #ff6b35;
    --accent2: #ffd23f;
    --success: #06d6a0;
    --danger: #ef476f;
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  button:disabled, input:disabled { opacity: .55; cursor: not-allowed; }

  body {
    font-family: 'Space Grotesk', sans-serif;
    background: var(--bg);
    color: var(--fg);
    min-height: 100vh;
  }

  .bg-glow {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    overflow: hidden;
  }
  .bg-glow .orb {
    position: absolute; border-radius: 50%; filter: blur(120px); opacity: .18;
  }
  .bg-glow .orb1 { width: 500px; height: 500px; background: var(--accent); top: -10%; left: -8%; animation: orbFloat 18s ease-in-out infinite; }
  .bg-glow .orb2 { width: 400px; height: 400px; background: var(--accent2); bottom: -10%; right: -5%; animation: orbFloat 22s ease-in-out infinite reverse; }
  .bg-glow .orb3 { width: 300px; height: 300px; background: #7b2ff7; top: 50%; left: 60%; animation: orbFloat 15s ease-in-out infinite 3s; }

  @keyframes orbFloat {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(40px, -30px) scale(1.1); }
    66% { transform: translate(-20px, 20px) scale(.95); }
  }

  .app {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center;
    padding: 30px 20px 60px;
    min-height: 100vh;
  }

  header { text-align: center; margin-bottom: 30px; }
  header h1 {
    font-family: 'Outfit', sans-serif;
    font-weight: 900; font-size: clamp(2rem, 5vw, 3.2rem);
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -1px;
  }
  header p { color: var(--muted); font-size: .95rem; margin-top: 6px; }

  .main-grid {
    display: grid;
    grid-template-columns: 340px minmax(0, 1fr) 280px;
    grid-template-areas: "options wheel history";
    gap: 28px;
    max-width: 1280px;
    width: 100%;
    align-items: start;
  }

  @media (max-width: 1100px) {
    .main-grid {
      grid-template-columns: minmax(0, 1fr);
      grid-template-areas: "wheel" "options" "history";
      max-width: 600px;
    }
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px;
  }
  .card-title {
    font-family: 'Outfit', sans-serif;
    font-weight: 700; font-size: 1.05rem;
    margin-bottom: 16px;
    display: flex; align-items: center; gap: 8px;
  }
  .card-title i { color: var(--accent); font-size: .9rem; }

  .options-panel { grid-area: options; }
  .history-panel { grid-area: history; }
  .wheel-area { grid-area: wheel; }
  @media (min-width: 1101px) {
    .options-panel, .history-panel { max-height: 75vh; overflow-y: auto; }
  }
  .options-panel::-webkit-scrollbar, .history-panel::-webkit-scrollbar { width: 4px; }
  .options-panel::-webkit-scrollbar-thumb, .history-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .save-indicator {
    display: flex; align-items: center; gap: 6px;
    font-size: .72rem; color: var(--success); margin-bottom: 12px;
    opacity: 0; transition: opacity .3s;
  }
  .save-indicator.show { opacity: 1; }

  .option-row {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 8px;
    animation: fadeSlideIn .3s ease;
  }
  @keyframes fadeSlideIn {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .color-dot {
    width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0;
    border: 2px solid rgba(255,255,255,.1);
  }

  .option-row input[type="text"] {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 12px;
    color: var(--fg);
    font-family: inherit;
    min-width: 0;
    font-size: .88rem;
    transition: border-color .2s;
  }
  .option-row input[type="text"]:focus { border-color: var(--accent); }

  .btn-icon {
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--muted);
    cursor: pointer;
    font-size: .8rem;
    transition: all .2s;
    flex-shrink: 0;
  }
  .btn-icon:hover { border-color: var(--danger); color: var(--danger); background: rgba(239,71,111,.08); }

  .btn-add {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    width: 100%; padding: 10px;
    border: 1px dashed var(--border);
    border-radius: 8px;
    background: transparent;
    color: var(--muted);
    font-family: inherit; font-size: .85rem;
    cursor: pointer;
    transition: all .2s;
    margin-top: 4px;
  }
  .btn-add:hover { border-color: var(--accent); color: var(--accent); }

  .actions-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .btn-sm {
    flex: 1; padding: 9px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--fg);
    font-family: inherit; font-size: .8rem;
    cursor: pointer;
    transition: all .2s;
    display: flex; align-items: center; justify-content: center; gap: 5px;
  }
  .btn-sm:hover { border-color: var(--accent); color: var(--accent); }

  /* Boutons export/import — style distinct */
  .backup-row {
    display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }
  .btn-backup {
    flex: 1; padding: 10px 8px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--fg);
    font-family: inherit; font-size: .75rem;
    cursor: pointer;
    transition: all .2s;
    display: flex; align-items: center; justify-content: center; gap: 5px;
    line-height: 1.3;
  }
  .btn-backup:hover { border-color: var(--accent2); color: var(--accent2); }
  .btn-backup i { font-size: .85rem; }

  .wheel-area {
    display: flex; flex-direction: column; align-items: center; gap: 24px;
  }

  .wheel-container {
    position: relative;
    width: 100%; max-width: 480px;
    aspect-ratio: 1;
  }

  .wheel-canvas-wrap {
    position: absolute; inset: 0;
    overflow: clip;
    display: flex; align-items: center; justify-content: center;
  }

  .wheel-canvas-wrap {
    filter: drop-shadow(0 0 40px rgba(255,107,53,.15));
    transition: filter .3s;
  }
  .wheel-canvas-wrap.spinning {
    filter: drop-shadow(0 0 60px rgba(255,107,53,.3));
  }

  #wheelCanvas { display: block; width: 100%; height: 100%; }

  .pointer {
    position: absolute;
    top: -8px; left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    width: 0; height: 0;
    border-left: 18px solid transparent;
    border-right: 18px solid transparent;
    border-top: 38px solid var(--accent);
    filter: drop-shadow(0 4px 10px rgba(255,107,53,.5));
    transition: transform .1s;
  }
  .pointer.tick { transform: translateX(-50%) scaleY(.85); }

  .wheel-center {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 60px; height: 60px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--card) 40%, var(--bg) 100%);
    border: 3px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    z-index: 5; pointer-events: none;
  }
  .wheel-center i { color: var(--accent); font-size: 1.2rem; }

  /* Version simplifiée : plus de ::before clippé par overflow:hidden */
  .btn-spin {
    padding: 16px 60px;
    border: none;
    border-radius: 60px;
    background: linear-gradient(135deg, var(--accent), #e85d2c);
    color: #fff;
    font-family: 'Outfit', sans-serif;
    font-weight: 800; font-size: 1.15rem;
    letter-spacing: 1px;
    cursor: pointer;
    transition: transform .3s, box-shadow .3s, filter .3s;
    text-transform: uppercase;
  }
  .btn-spin:not(:disabled):hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(255,107,53,.4);
    filter: brightness(1.08);
  }
  .btn-spin:active { transform: translateY(0); }
  .btn-spin:disabled { opacity: .5; cursor: not-allowed; }

  .history-list { display: flex; flex-direction: column; gap: 8px; }

  .history-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px;
    background: var(--bg);
    border-radius: 10px;
    border: 1px solid var(--border);
    animation: fadeSlideIn .35s ease;
  }
  .history-item .h-num {
    overflow: hidden;
    width: 26px; height: 26px;
    border-radius: 50%;
    background: var(--card); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: .7rem; color: var(--muted); font-weight: 600; flex-shrink: 0;
  }
  .history-item .h-label { flex: 1; min-width: 0; overflow-wrap: anywhere; font-size: .88rem; font-weight: 500; }
  .history-item .h-time { font-size: .68rem; color: var(--muted); white-space: nowrap; }
  .history-item .h-color {
    width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
  }

  .empty-state {
    text-align: center; padding: 30px 10px; color: var(--muted); font-size: .85rem;
  }
  .empty-state i { font-size: 2rem; margin-bottom: 10px; display: block; opacity: .4; }

  .btn-clear-history {
    width: 100%; padding: 9px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: transparent;
    color: var(--muted);
    font-family: inherit; font-size: .8rem;
    cursor: pointer; transition: all .2s;
    margin-top: 12px;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .btn-clear-history[hidden] { display: none; }
  .btn-clear-history:hover { border-color: var(--danger); color: var(--danger); }

  .result-overlay {
    position: fixed; inset: 0;
    margin: auto; padding: 0; border: 0;
    width: 100%; height: 100%; max-width: none; max-height: none;
    background: transparent; color: var(--fg);
  }
  .result-overlay[open] { display: grid; place-items: center; }
  .result-overlay::backdrop { background: rgba(0,0,0,.7); backdrop-filter: blur(8px); }
  body:has(.result-overlay[open]) { overflow: hidden; }

  .result-modal {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: clamp(16px, 5vh, 48px) clamp(16px, 6vw, 40px);
    text-align: center;
    max-width: 400px; width: 90%;
    position: relative; z-index: 1;
    max-height: calc(100% - 24px); overflow: auto;
    animation: resultIn .45s cubic-bezier(.175,.885,.32,1.275);
  }
  @keyframes resultIn { from { opacity: 0; transform: scale(.8) translateY(30px); } }

  .result-modal .result-label {
    font-weight: 400;
    font-size: .85rem; color: var(--muted); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 14px;
  }
  .result-modal .result-value {
    font-family: 'Outfit', sans-serif;
    font-weight: 900; font-size: 2.2rem;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 28px;
    overflow-wrap: anywhere;
  }
  .result-modal .result-color-bar {
    width: 60px; height: 5px; border-radius: 3px; margin: 0 auto 28px;
  }
  .btn-close-result {
    padding: 12px 40px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--bg);
    color: var(--fg);
    font-family: inherit; font-size: .9rem;
    cursor: pointer; transition: all .2s;
  }
  .btn-close-result:hover { border-color: var(--accent); color: var(--accent); }

  .confetti-container {
    position: fixed; inset: 0; pointer-events: none; overflow: hidden;
  }
  .confetti-piece {
    position: absolute;
    width: 10px; height: 10px;
    top: -20px; opacity: 0;
    animation: confettiFall linear forwards;
  }
  @keyframes confettiFall {
    0% { opacity: 1; transform: translateY(0) rotate(0deg) scale(1); }
    80% { opacity: 1; }
    100% { opacity: 0; transform: translateY(100vh) rotate(720deg) scale(.3); }
  }

  .sound-toggle {
    position: fixed; top: 20px; right: 20px; z-index: 100;
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--card); border: 1px solid var(--border);
    color: var(--muted);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: .9rem;
    transition: all .2s;
  }
  .sound-toggle:hover { color: var(--accent); border-color: var(--accent); }

  .presets-row {
    display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px;
  }
  .preset-chip {
    padding: 5px 12px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--muted);
    font-family: inherit; font-size: .72rem;
    cursor: pointer; transition: all .2s;
    white-space: nowrap;
  }
  .preset-chip:hover { border-color: var(--accent2); color: var(--accent2); }

  .toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 24px; color: var(--fg); font-size: .85rem; z-index: 2000;
    width: max-content; max-width: calc(100% - 24px);
    overflow-wrap: anywhere;
    opacity: 0; transition: opacity .35s, transform .35s; pointer-events: none;
    display: flex; align-items: center; gap: 8px;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast i { color: var(--success); }
  .toast i.warn { color: var(--accent2); }
  .toast i.err { color: var(--danger); }

  button:focus-visible, input:focus-visible {
    outline: 2px solid var(--accent2);
    outline-offset: 2px;
  }
  .storage-notice { color: var(--accent2); font-size: .8rem; }
  .options-panel .storage-notice:not(:empty) { margin-bottom: 12px; }
  .result-modal .storage-notice:not(:empty) { margin-bottom: 16px; }
  /* Conserver les dimensions d'origine au pointeur précis et les cibles tactiles. */
  @media (pointer: coarse) {
    .btn-icon, .sound-toggle { width: 44px; height: 44px; }
    .btn-add, .btn-sm, .btn-backup, .btn-clear-history, .preset-chip, .btn-close-result { min-height: 44px; }
    .option-row input[type="text"] { font-size: 1rem; }
  }

  @media (max-width: 480px) {
    .app { padding: 70px 12px 36px; }
    .card { padding: 16px; }
    .wheel-center { width: 44px; height: 44px; }
  }

  @media (max-width: 1100px) and (orientation: landscape) and (max-height: 500px) {
    .app { padding-top: 16px; }
    header { max-width: calc(100% - 108px); margin-bottom: 16px; }
    .wheel-area { gap: 12px; }
    .wheel-container { max-width: 55vh; }
  }

  /* Input file caché */
  #importInput { display: none; }

  /* Respect des préférences de réduction d'animations */
  @media (prefers-reduced-motion: reduce) {
    .bg-glow .orb { animation: none; }
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
      transition-delay: 0s !important;
      scroll-behavior: auto !important;
    }
  }
</style>
</head>
<body>

<div class="bg-glow" aria-hidden="true">
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>
</div>

<button class="sound-toggle" id="soundToggle" aria-label="Son">
  <i class="fas fa-volume-high" aria-hidden="true"></i>
</button>

<!-- Input file caché pour l'import -->
<input type="file" id="importInput" accept="application/json,.json">

<div class="app">
  <header>
    <h1>Wheel Spin</h1>
    <p>Personnalise ta roue et laisse le hasard décider</p>
  </header>

  <main class="main-grid">

    <div class="wheel-area">
      <div class="wheel-container">
        <div class="pointer" id="pointer" aria-hidden="true"></div>
        <div class="wheel-canvas-wrap">
          <canvas id="wheelCanvas" width="960" height="960" role="img" aria-label="Roue de la fortune"></canvas>
        </div>
        <div class="wheel-center"><i class="fas fa-star" aria-hidden="true"></i></div>
      </div>
      <button class="btn-spin" id="btnSpin">Tourner</button>
    </div>

    <section class="card options-panel" aria-labelledby="optionsTitle">
      <h2 class="card-title" id="optionsTitle"><i class="fas fa-sliders" aria-hidden="true"></i> Options de la roue</h2>
      <div class="save-indicator" id="saveIndicator" aria-hidden="true">
        <i class="fas fa-check-circle" aria-hidden="true"></i> Sauvegardé automatiquement
      </div>

      <p class="storage-notice" id="storageNotice" role="status"></p>
      <div class="presets-row">
        <button class="preset-chip" data-preset="yesno">Oui / Non</button>
        <button class="preset-chip" data-preset="numbers">1 à 6</button>
        <button class="preset-chip" data-preset="colors">Couleurs</button>
        <button class="preset-chip" data-preset="dinner">Resto ce soir</button>
        <button class="preset-chip" data-preset="dares">Gages</button>
      </div>

      <div id="optionsList"></div>
      <button class="btn-add" id="btnAdd"><i class="fas fa-plus" aria-hidden="true"></i> Ajouter une option</button>

      <div class="actions-row">
        <button class="btn-sm" id="btnShuffle"><i class="fas fa-shuffle" aria-hidden="true"></i> Mélanger</button>
        <button class="btn-sm" id="btnReset"><i class="fas fa-rotate-left" aria-hidden="true"></i> Réinitialiser</button>
      </div>

      <!-- Export / Import -->
      <div class="backup-row">
        <button class="btn-backup" id="btnExport">
          <i class="fas fa-download" aria-hidden="true"></i> Exporter
        </button>
        <button class="btn-backup" id="btnImport">
          <i class="fas fa-upload" aria-hidden="true"></i> Importer
        </button>
      </div>
    </section>

    <section class="card history-panel" aria-labelledby="historyTitle">
      <h2 class="card-title" id="historyTitle"><i class="fas fa-clock-rotate-left" aria-hidden="true"></i> Historique</h2>
      <div class="history-list" id="historyList">
        <div class="empty-state">
          <i class="fas fa-dice" aria-hidden="true"></i>
          Lance la roue pour voir les résultats ici
        </div>
      </div>
      <button class="btn-clear-history" id="btnClearHistory" hidden>
        <i class="fas fa-trash-can" aria-hidden="true"></i> Effacer l'historique
      </button>
    </section>
  </main>
</div>

<dialog class="result-overlay" id="resultOverlay" aria-labelledby="resultTitle" aria-describedby="resultValue resultStorageNotice">
  <div class="confetti-container" id="confettiContainer" aria-hidden="true"></div>
  <div class="result-modal">
    <h2 class="result-label" id="resultTitle">Résultat</h2>
    <div class="result-value" id="resultValue"></div>
    <div class="result-color-bar" id="resultColorBar"></div>
    <p class="storage-notice" id="resultStorageNotice"></p>
    <button class="btn-close-result" id="btnCloseResult" autofocus>Fermer</button>
  </div>
</dialog>

<div class="toast" id="toast" role="status" aria-atomic="true"></div>

<script>
// ============================================
// CONSTANTES
// ============================================

const SEGMENT_COLORS = [
  '#ff6b35', '#ffd23f', '#06d6a0', '#118ab2', '#ef476f',
  '#7b2ff7', '#ff9f1c', '#2ec4b6', '#e71d36', '#3a86ff',
  '#8338ec', '#fb5607', '#ff006e', '#38b000', '#480ca8',
  '#f72585', '#4cc9f0', '#80ed99', '#f4845f', '#c77dff'
];

const PRESETS = {
  yesno: ['Oui', 'Non'],
  numbers: ['1', '2', '3', '4', '5', '6'],
  colors: ['Rouge', 'Bleu', 'Vert', 'Jaune', 'Violet', 'Orange'],
  dinner: ['Pizza', 'Sushi', 'Burger', 'Pâtes', 'Salade', 'Tacos', 'Kebab', 'Indien'],
  dares: ['Chanter', 'Danser', 'Imiter', 'Raconter une blague', 'Faire un puppet', 'Mimer un film']
};

const DEFAULT_OPTIONS = ['Pizza', 'Sushi', 'Burger', 'Pâtes', 'Tacos', 'Salade'];

// Version du format de sauvegarde pour compatibilité future
const SAVE_VERSION = 1;
const MAX_IMPORT_BYTES = 8 * 1024 * 1024;
const TURN = Math.PI * 2;

// ============================================
// VALIDATION / ASSAINISSEMENT DES DONNÉES
// ============================================

// Couleurs acceptées : #rgb, #rgba, #rrggbb, #rrggbbaa
function isValidColor(c) {
  return typeof c === 'string' && /^#(?:[0-9a-f]{3,4}|[0-9a-f]{6}|[0-9a-f]{8})$/i.test(c);
}

function sanitizeOptions(arr) {
  if (!Array.isArray(arr)) return null;
  const clean = arr.filter(option => typeof option === 'string').slice(0, SEGMENT_COLORS.length);
  return clean.length >= 2 ? clean : null;
}

function sanitizeHistory(arr) {
  if (!Array.isArray(arr)) return [];
  return arr
    .filter(h => h && typeof h.label === 'string' && isValidColor(h.color))
    .slice(0, 100)
    .map((h, i) => ({
      label: h.label,
      color: h.color,
      num: Number.isSafeInteger(h.num) && h.num > 0 && h.num < Number.MAX_SAFE_INTEGER ? h.num : i + 1,
      time: Number.isFinite(h.time) && Math.abs(h.time) <= 8.64e15 ? h.time : Date.now()
    }));
}

// ============================================
// PERSISTANCE LOCALSTORAGE
// ============================================

const STORAGE_KEYS = {
  options: 'wheelspin_options',
  history: 'wheelspin_history',
  sound: 'wheelspin_sound',
  angle: 'wheelspin_angle'
};

const saved = {};
const unsaved = new Set();
const conflicts = new Set();
const storageNotice = document.getElementById('storageNotice');
const storageMessage = 'Certaines données restent dans cet onglet. Vérifie le stockage du navigateur ou exporte-les.';

function updateStorageNotice() {
  const message = conflicts.size
    ? 'Des données ont changé dans un autre onglet. Exporte tes modifications avant de recharger.'
    : unsaved.size ? storageMessage : '';
  if (storageNotice.textContent !== message) storageNotice.textContent = message;
  if (message) document.getElementById('saveIndicator').classList.remove('show');
}

for (const [name, key] of Object.entries(STORAGE_KEYS)) {
  try { saved[name] = localStorage.getItem(key); }
  catch { unsaved.add(name); }
}

function parseStored(raw) {
  try { return JSON.parse(raw); }
  catch { return null; }
}

function parseAngle(raw) {
  const angle = Number(raw);
  return Number.isFinite(angle) ? angle % TURN : 0;
}

function persist(changes, keepLocalOnFailure = true) {
  const entries = Object.entries(changes);
  const written = [];
  const previous = {};
  let conflict = false;
  try {
    for (const [name] of entries) {
      previous[name] = localStorage.getItem(STORAGE_KEYS[name]);
      if (name !== 'angle' && Object.hasOwn(saved, name) && previous[name] !== saved[name]) {
        if (keepLocalOnFailure) conflicts.add(name);
        conflict = true;
      }
    }
    if (conflict) {
      updateStorageNotice();
      return false;
    }
    for (const [name, raw] of entries) {
      localStorage.setItem(STORAGE_KEYS[name], raw);
      written.push([name, raw]);
    }
  } catch {
    // Rétablir les clés déjà écrites si une écriture de l’import échoue.
    for (const [name, raw] of written.reverse()) {
      const key = STORAGE_KEYS[name];
      try {
        if (localStorage.getItem(key) !== raw) continue;
        if (previous[name] === null) localStorage.removeItem(key);
        else localStorage.setItem(key, previous[name]);
      } catch { conflicts.add(name); }
    }
    if (keepLocalOnFailure) {
      for (const [name] of entries) unsaved.add(name);
    }
    updateStorageNotice();
    return false;
  }
  for (const [name, raw] of entries) {
    saved[name] = raw;
    unsaved.delete(name);
    conflicts.delete(name);
  }
  updateStorageNotice();
  return true;
}

function saveOptions() {
  const previousNotice = storageNotice.textContent;
  const ok = persist({ options: JSON.stringify(options) });
  if (!ok && previousNotice !== storageNotice.textContent) showToast(storageNotice.textContent, 'warn');
  if (ok && !storageNotice.textContent) flashSaveIndicator();
  return ok;
}


// Indicateur de sauvegarde
let saveTimeout = null;
function flashSaveIndicator() {
  const el = document.getElementById('saveIndicator');
  el.classList.add('show');
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(() => el.classList.remove('show'), 1800);
}

function exportData() {
  // Tout regrouper dans un seul objet
  const data = {
    version: SAVE_VERSION,
    exportedAt: new Date().toISOString(),
    options: options,
    history: spinHistory,
    angle: currentAngle
  };

  const json = JSON.stringify(data, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);

  const a = document.createElement('a');
  // Nom de fichier avec la date pour s'y retrouver
  const dateStr = new Date().toLocaleDateString('fr-FR', {
    year: 'numeric', month: '2-digit', day: '2-digit'
  }).replace(/\//g, '-');
  a.href = url;
  a.download = `wheel-spin-backup-${dateStr}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);

  showToast('Téléchargement de la sauvegarde lancé');
}

async function importData(file) {
  if (spinning || importing || resultOverlay.open) return;
  if (file.size > MAX_IMPORT_BYTES) {
    showToast('Ce fichier dépasse la limite de 8 Mio', 'error');
    return;
  }

  importing = true;
  updateControls();
  try {
    let json;
    try { json = await file.text(); }
    catch {
      showToast('Impossible de lire le fichier', 'error');
      return;
    }

    let data;
    try { data = JSON.parse(json); }
    catch {
      showToast('Le fichier ne contient pas de JSON valide', 'error');
      return;
    }

    const nextOptions = sanitizeOptions(data?.options);
    const nextHistory = sanitizeHistory(data?.history);
    if (!nextOptions || nextOptions.length !== data.options.length ||
        (data.history !== undefined && (!Array.isArray(data.history) || data.history.length !== nextHistory.length)) ||
        (data.angle !== undefined && !Number.isFinite(data.angle))) {
      showToast('Sauvegarde invalide : vérifie les options, l’historique et l’angle', 'error');
      return;
    }
    if (!confirm('Remplacer les options et l’historique actuels par ceux du fichier ?')) return;

    const nextAngle = data.angle === undefined ? currentAngle : parseAngle(data.angle);
    if (!persist({
      options: JSON.stringify(nextOptions),
      history: JSON.stringify(nextHistory),
      angle: String(nextAngle)
    }, false)) {
      showToast('Impossible d’enregistrer cet import', 'error');
      return;
    }

    options = nextOptions;
    spinHistory = nextHistory;
    currentAngle = nextAngle;
    renderOptions();
    renderHistory();
    let message = 'Sauvegarde importée';
    if (data.version > SAVE_VERSION) message += ' (version plus récente)';
    else if (typeof data.exportedAt === 'string') {
      const date = new Date(data.exportedAt);
      if (Number.isFinite(date.getTime())) message += ' (export du ' + date.toLocaleDateString('fr-FR') + ')';
    }
    showToast(message);
  } finally {
    importing = false;
    updateControls();
    document.getElementById('btnImport').focus();
  }
}

let options = sanitizeOptions(parseStored(saved.options)) || [...DEFAULT_OPTIONS];
let spinHistory = sanitizeHistory(parseStored(saved.history));
let spinning = false;
let importing = false;
let currentAngle = parseAngle(saved.angle);
let soundEnabled = saved.sound !== '0';


// ============================================
// AUDIO
// ============================================

let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function startAudio() {
  if (!soundEnabled) return;
  try {
    const ctx = getAudioCtx();
    if (ctx.state !== 'running') ctx.resume().catch(() => {});
  } catch {}
}

function playTick() {
  if (!soundEnabled || audioCtx?.state !== 'running') return;
  try {
    const ctx = audioCtx;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(800 + Math.random() * 400, ctx.currentTime);
    gain.gain.setValueAtTime(0.08, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
    osc.connect(gain).connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.05);
  } catch (e) {}
}

function playWin() {
  if (!soundEnabled || audioCtx?.state !== 'running') return;
  try {
    const ctx = audioCtx;
    [523, 659, 784, 1047].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.12);
      gain.gain.setValueAtTime(0.12, ctx.currentTime + i * 0.12);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.12 + 0.3);
      osc.connect(gain).connect(ctx.destination);
      osc.start(ctx.currentTime + i * 0.12);
      osc.stop(ctx.currentTime + i * 0.12 + 0.3);
    });
  } catch (e) {}
}

// ============================================
// CANVAS
// ============================================

const canvas = document.getElementById('wheelCanvas');
const ctxC = canvas.getContext('2d');
const wheelWrap = canvas.parentElement;
const pointer = document.getElementById('pointer');
const spinButton = document.getElementById('btnSpin');
const resultOverlay = document.getElementById('resultOverlay');
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');


function labelText(label) {
  return /\S/.test(label) ? label : 'Option';
}

function fitLabel(label, width) {
  // Borner le travail sur les anciens imports contenant des textes longs.
  const chars = Array.from(label.slice(0, 240)).slice(0, 120);
  if (chars.join('') === label && ctxC.measureText(label).width <= width) return label;
  let min = 0;
  let max = chars.length;
  while (min < max) {
    const middle = Math.ceil((min + max) / 2);
    if (ctxC.measureText(chars.slice(0, middle).join('') + '…').width <= width) min = middle;
    else max = middle - 1;
  }
  return chars.slice(0, min).join('') + '…';
}

function rotateWheel(angle) {
  canvas.style.transform = 'rotate(' + angle + 'rad)';
}

function drawWheel() {
  if (!ctxC) return;
  const W = canvas.width;
  const H = canvas.height;
  const cx = W / 2;
  const cy = H / 2;
  const R = Math.max(1, (Math.min(W, H) / 2) - 20);

  ctxC.clearRect(0, 0, W, H);

  const n = options.length;
  const sliceAngle = TURN / n;

  for (let i = 0; i < n; i++) {
    const startA = i * sliceAngle;
    const endA = startA + sliceAngle;
    const color = SEGMENT_COLORS[i];

    ctxC.beginPath();
    ctxC.moveTo(cx, cy);
    ctxC.arc(cx, cy, R, startA, endA);
    ctxC.closePath();
    ctxC.fillStyle = color;
    ctxC.fill();

    ctxC.strokeStyle = 'rgba(0,0,0,.25)';
    ctxC.lineWidth = 2;
    ctxC.stroke();

    ctxC.save();
    ctxC.translate(cx, cy);
    ctxC.rotate(startA + sliceAngle / 2);
    ctxC.textAlign = 'right';
    ctxC.textBaseline = 'middle';

    const label = labelText(options[i]);
    const maxTextWidth = R * 0.55;
    const fontSize = Math.min(32, Math.max(16, sliceAngle * R * 0.18));
    ctxC.font = `600 ${fontSize}px "Space Grotesk", sans-serif`;
    ctxC.fillStyle = '#fff';
    ctxC.shadowColor = 'rgba(0,0,0,.5)';
    ctxC.shadowBlur = 6;
    ctxC.shadowOffsetX = 1;
    ctxC.shadowOffsetY = 1;
    ctxC.fillText(fitLabel(label, maxTextWidth), R - 28, 0);

    ctxC.restore();
  }

  ctxC.beginPath();
  ctxC.arc(cx, cy, R, 0, Math.PI * 2);
  ctxC.strokeStyle = 'rgba(255,255,255,.08)';
  ctxC.lineWidth = 8;
  ctxC.stroke();

  for (let i = 0; i < n; i++) {
    const dotAngle = i * sliceAngle;
    const dx = cx + Math.cos(dotAngle) * (R - 4);
    const dy = cy + Math.sin(dotAngle) * (R - 4);
    ctxC.beginPath();
    ctxC.arc(dx, dy, 4, 0, Math.PI * 2);
    ctxC.fillStyle = 'rgba(255,255,255,.5)';
    ctxC.fill();
  }
}

// ============================================
// SPIN
// ============================================

function updateControls() {
  const busy = spinning || importing;
  document.querySelectorAll(
    '#optionsList input, #optionsList button, #btnAdd, #btnShuffle, #btnReset, .preset-chip, #btnExport, #btnImport, #btnClearHistory'
  ).forEach(el => { el.disabled = busy; });
  spinButton.disabled = busy;
}

function sliceAt(angle, n) {
  const position = ((-Math.PI / 2 - angle) % TURN + TURN) % TURN;
  return Math.floor(position / (TURN / n)) % n;
}

function spinWheel() {
  if (spinning || importing || resultOverlay.open) return;
  startAudio();
  spinning = true;
  updateControls();

  const startAngle = currentAngle;
  const totalRotation = TURN * (5 + Math.floor(Math.random() * 5) + Math.random());
  const finalAngle = (startAngle + totalRotation) % TURN;
  const count = options.length;
  const winner = sliceAt(finalAngle, count);
  let lastSlice = sliceAt(startAngle, count);
  let tickTimer;

  function finish() {
    clearTimeout(tickTimer);
    pointer.classList.remove('tick');
    wheelWrap.classList.remove('spinning');
    currentAngle = finalAngle;
    rotateWheel(currentAngle);

    const result = labelText(options[winner]);
    const color = SEGMENT_COLORS[winner];
    syncStorage('history');
    spinHistory.unshift({ label: result, color, num: (spinHistory[0]?.num || 0) + 1, time: Date.now() });
    if (spinHistory.length > 100) spinHistory.pop();
    const savedResult = persist({ history: JSON.stringify(spinHistory) });
    const savedAngle = persist({ angle: String(currentAngle) });

    spinning = false;
    updateControls();
    renderHistory();
    showResult(result, color, savedResult && savedAngle ? '' : storageNotice.textContent);
    playWin();
    launchConfetti(color);
  }

  if (reducedMotion.matches) {
    finish();
    return;
  }

  wheelWrap.classList.add('spinning');
  const duration = 4000 + Math.random() * 2000;
  const startTime = performance.now();

  function animate(now) {
    const progress = Math.max(0, (now - startTime) / duration);
    if (progress >= 1 || reducedMotion.matches) {
      finish();
      return;
    }

    const angle = startAngle + totalRotation * (1 - (1 - progress) ** 4);
    rotateWheel(angle);
    const slice = sliceAt(angle, count);
    if (slice !== lastSlice) {
      lastSlice = slice;
      playTick();
      pointer.classList.add('tick');
      clearTimeout(tickTimer);
      tickTimer = setTimeout(() => pointer.classList.remove('tick'), 60);
    }
    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);
}

function showResult(label, color, message) {
  document.getElementById('resultValue').textContent = label;
  document.getElementById('resultColorBar').style.backgroundColor = color;
  document.getElementById('resultStorageNotice').textContent = message;
  resultOverlay.showModal();
}

const confetti = document.getElementById('confettiContainer');
let confettiTimer;
function launchConfetti(mainColor) {
  if (reducedMotion.matches) return;
  const pieces = document.createDocumentFragment();
  const colors = [mainColor, '#ffd23f', '#fff', '#06d6a0', '#ff6b35', '#7b2ff7'];

  for (let i = 0; i < 60; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random() * 100 + '%';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.width = (6 + Math.random() * 8) + 'px';
    piece.style.height = (6 + Math.random() * 8) + 'px';
    piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    piece.style.animationDuration = (1.5 + Math.random() * 2) + 's';
    piece.style.animationDelay = (Math.random() * .6) + 's';
    pieces.appendChild(piece);
  }
  confetti.replaceChildren(pieces);
  confettiTimer = setTimeout(() => confetti.replaceChildren(), 4200);
}


// ============================================
// HISTORIQUE
// ============================================

function formatTime(timestamp) {
  const d = new Date(timestamp);
  const now = new Date();
  const diffMs = now - d;
  const diffMin = Math.floor(diffMs / 60000);

  if (diffMin >= 0 && diffMin < 1) return "à l'instant";
  if (diffMin >= 0 && diffMin < 60) return `il y a ${diffMin}min`;

  const diffH = Math.floor(diffMin / 60);
  if (diffH >= 0 && diffH < 24) return `il y a ${diffH}h`;

  return d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
}


function makeElement(tag, className, text) {
  const element = document.createElement(tag);
  element.className = className;
  if (text !== undefined) element.textContent = text;
  return element;
}

function makeIcon(name, className = '') {
  const icon = makeElement('i', 'fas ' + name + (className ? ' ' + className : ''));
  icon.setAttribute('aria-hidden', 'true');
  return icon;
}

const historyList = document.getElementById('historyList');
const clearButton = document.getElementById('btnClearHistory');
const emptyHistory = historyList.firstElementChild;

function renderHistory() {
  clearButton.hidden = spinHistory.length === 0;
  if (clearButton.hidden) {
    historyList.replaceChildren(emptyHistory);
    return;
  }

  historyList.replaceChildren(...spinHistory.map(item => {
    const row = makeElement('div', 'history-item');
    const number = makeElement('div', 'h-num', item.num);
    const label = makeElement('div', 'h-label', labelText(item.label));
    const time = makeElement('time', 'h-time', formatTime(item.time));
    time.dateTime = new Date(item.time).toISOString();
    const color = makeElement('div', 'h-color');
    color.style.backgroundColor = item.color;
    row.append(number, label, time, color);
    return row;
  }));
}

function clearHistory() {
  if (!confirm('Effacer tout l’historique des tirages ?')) return;
  if (!persist({ history: '[]' }, false)) {
    showToast('Impossible d’effacer l’historique enregistré', 'error');
    return;
  }
  spinHistory = [];
  renderHistory();
  spinButton.focus();
  showToast('Historique effacé');
}

// ============================================
// OPTIONS
// ============================================

const optionsList = document.getElementById('optionsList');

function renderOptions() {
  optionsList.replaceChildren(...options.map((option, index) => {
    const row = makeElement('div', 'option-row');
    const color = makeElement('div', 'color-dot');
    color.style.backgroundColor = SEGMENT_COLORS[index];
    const input = document.createElement('input');
    input.type = 'text';
    input.value = option;
    input.placeholder = 'Option';
    input.maxLength = 40;
    input.setAttribute('aria-label', 'Option ' + (index + 1));
    input.addEventListener('input', () => {
      options[index] = input.value;
      saveOptions();
      drawWheel();
    });

    const remove = makeElement('button', 'btn-icon');
    remove.title = 'Supprimer';
    remove.setAttribute('aria-label', 'Supprimer l’option ' + (index + 1));
    remove.append(makeIcon('fa-xmark'));
    remove.addEventListener('click', () => {
      if (options.length <= 2) {
        showToast('Il faut au moins 2 options', 'warn');
        return;
      }
      options.splice(index, 1);
      renderOptions();
      saveOptions();
      optionsList.children[Math.min(index, options.length - 1)].querySelector('button').focus();
    });
    row.append(color, input, remove);
    return row;
  }));
  drawWheel();
  rotateWheel(currentAngle);
}

function addOption() {
  if (options.length >= SEGMENT_COLORS.length) {
    showToast('Maximum 20 options atteint', 'warn');
    return;
  }
  options.push('Option ' + (options.length + 1));
  renderOptions();
  saveOptions();
  const input = optionsList.lastElementChild.querySelector('input');
  input.focus();
  input.select();
}

function shuffleOptions() {
  for (let i = options.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [options[i], options[j]] = [options[j], options[i]];
  }
  renderOptions();
  if (saveOptions()) showToast('Options mélangées');
}

function replaceOptions(next, message) {
  if (options.length === next.length && options.every((option, index) => option === next[index])) return;
  if (!confirm('Remplacer les options actuelles ?')) return;
  options = [...next];
  renderOptions();
  if (saveOptions()) showToast(message);
}

// ============================================
// INTERFACE ET SYNCHRONISATION
// ============================================

let toastTimeout;
function showToast(message, type = 'success') {
  const toast = document.getElementById('toast');
  const icon = makeIcon(type === 'success' ? 'fa-check-circle' : 'fa-triangle-exclamation', { warn: 'warn', error: 'err' }[type]);
  toast.replaceChildren(icon, makeElement('span', '', message));
  toast.classList.add('show');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => toast.classList.remove('show'), 2500);
}

function updateSoundIcon() {
  const button = document.getElementById('soundToggle');
  button.querySelector('i').className = soundEnabled ? 'fas fa-volume-high' : 'fas fa-volume-xmark';
  button.setAttribute('aria-label', soundEnabled ? 'Désactiver le son' : 'Activer le son');
}

function syncStorage(name) {
  // Conserver les modifications de cet onglet si elles n’ont pas pu être écrites.
  if (unsaved.has(name) || conflicts.has(name)) return;
  if ((spinning || resultOverlay.open) && (name === 'options' || name === 'angle')) return;

  let raw;
  try { raw = localStorage.getItem(STORAGE_KEYS[name]); }
  catch { return; }
  if (raw === saved[name]) return;
  saved[name] = raw;

  if (name === 'history') {
    spinHistory = sanitizeHistory(parseStored(raw));
    renderHistory();
  } else if (name === 'options') {
    const focusedIndex = [...optionsList.children].findIndex(row => row.contains(document.activeElement));
    const control = document.activeElement?.localName;
    options = sanitizeOptions(parseStored(raw)) || [...DEFAULT_OPTIONS];
    renderOptions();
    if (focusedIndex >= 0) optionsList.children[Math.min(focusedIndex, options.length - 1)].querySelector(control).focus();
    updateControls();
  } else if (name === 'sound') {
    soundEnabled = raw !== '0';
    updateSoundIcon();
  } else if (name === 'angle') {
    currentAngle = parseAngle(raw);
    rotateWheel(currentAngle);
  }
}

  startAudio();

    showToast('Préférence de son non enregistrée', 'warn');
  }
});

document.addEventListener('keydown', (event) => {
  if (event.code !== 'Space' || event.defaultPrevented || event.isComposing ||
      event.altKey || event.ctrlKey || event.metaKey || event.shiftKey || resultOverlay.open) return;
  if (event.target.closest?.('input, textarea, button, a, [contenteditable]')) return;
  event.preventDefault();
  if (!event.repeat) spinWheel();
});

window.addEventListener('storage', (event) => {
  if (event.storageArea !== localStorage) return;
  for (const [name, key] of Object.entries(STORAGE_KEYS)) {
    if (event.key === key || event.key === null) syncStorage(name);
  }
});

updateSoundIcon();
updateStorageNotice();
renderOptions();
renderHistory();

if (!ctxC) {
  canvas.replaceWith(makeElement('p', 'storage-notice', 'Aperçu de la roue indisponible. Les tirages restent accessibles.'));
}
if (document.fonts) document.fonts.ready.then(drawWheel);
</script>
</body>
</html>
